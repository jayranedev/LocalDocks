[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"

# Win32 bindings. Windows-gated so the dependency is not even resolved for
# another target, and feature-gated down to the three namespaces process
# discovery actually calls into: the crate is enormous and every feature is
# compile time.
#
#   Win32_Foundation                    HANDLE, FILETIME, CloseHandle, error codes
#   Win32_System_Diagnostics_ToolHelp   CreateToolhelp32Snapshot, Process32*W
#   Win32_System_Threading              OpenProcess, GetProcessTimes
#   Win32_System_ProcessStatus          GetProcessMemoryInfo (working set)
#   Win32_NetworkManagement_IpHelper    GetExtendedTcpTable / GetExtendedUdpTable
#   Win32_Networking_WinSock            AF_INET / AF_INET6
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }
