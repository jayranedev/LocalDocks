[package]
# `app` was the scaffold's name. The crate name reaches the user: it is what
# `cargo` prints, and without the `[[bin]]` below it is also what the installed
# executable is called — which for a process monitor would mean LocalDocks
# listing itself in its own Processes table as "app.exe".
name = "localdocks"
# ---------------------------------------------------------------------------
# THE VERSION. This is the single source of truth for the whole product.
#
# `tauri.conf.json` deliberately has no `version` key: Tauri falls back to this
# one, so the bundle, the installer, the Windows file metadata and the crate all
# carry the same number without anyone having to remember to update three files.
# `package.json` has no version either, for the same reason — it is private and
# never published, so a number there could only ever drift out of sync.
#
# Bump here, then tag the commit `v<version>`. Windows package versions must be
# plain numeric, so a pre-release marker lives in the git tag and the GitHub
# release flag, never here.
# ---------------------------------------------------------------------------
version = "0.9.0"
description = "A local development dashboard for Windows: services, processes, ports and system telemetry."
authors = ["Jay Rane"]
license = "MIT"
repository = "https://github.com/jayranedev/LocalDocks"
homepage = "https://github.com/jayranedev/LocalDocks"
readme = "../README.md"
keywords = ["dashboard", "processes", "ports", "windows", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "localdocks_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The shipped executable. Named here rather than through Tauri's
# `mainBinaryName` override because Tauri's own documentation prefers it: this
# way cargo produces `LocalDocks.exe` directly and there is no rename step
# between the build and the bundle that could disagree.
[[bin]]
name = "LocalDocks"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"

# The update channel (docs/UPDATES.md). The plugin is the officially supported
# mechanism for this Tauri version; a hand-rolled downloader would have to
# reimplement minisign verification, and getting that subtly wrong is how an
# update channel becomes a code-execution channel.
tauri-plugin-updater = "2"

# Version comparison for the update policy in `logic::release`. The updater
# plugin does its own semver check, but the *policy* — never downgrade, never
# offer a prerelease on the stable channel — is ours, is testable, and is
# enforced on our side of the plugin.
semver = "1"

# Win32 bindings. Windows-gated so the dependency is not even resolved for
# another target, and feature-gated down to the three namespaces process
# discovery actually calls into: the crate is enormous and every feature is
# compile time.
#
#   Win32_Foundation                    HANDLE, FILETIME, CloseHandle, error codes
#   Win32_System_Diagnostics_ToolHelp   CreateToolhelp32Snapshot, Process32*W
#   Win32_System_Threading              OpenProcess, GetProcessTimes
#   Win32_System_ProcessStatus          GetProcessMemoryInfo (working set)
#   Win32_NetworkManagement_IpHelper    GetExtendedTcpTable / GetExtendedUdpTable
#   Win32_Networking_WinSock            AF_INET / AF_INET6
#   Win32_UI_Shell                      ShellExecuteW (open a URL in the browser)
#   Win32_UI_WindowsAndMessaging        SW_SHOWNORMAL, for that call
#   Wdk_System_Threading                NtQueryInformationProcess, the sanest
#                                       route to a command line (BACKEND.md)
#   Wdk_System_SystemInformation        NtQuerySystemInformation, for
#                                       per-logical-processor CPU time
#   Win32_System_SystemInformation      GetSystemTimes, GlobalMemoryStatusEx
#   Win32_NetworkManagement_Ndis        MIB_IF_ROW2 operational status and type
#   Win32_Storage_FileSystem            CreateFileW on \\.\PhysicalDriveN
#   Win32_System_Ioctl                  IOCTL_DISK_PERFORMANCE, DISK_PERFORMANCE
#   Win32_System_IO                     DeviceIoControl, for that IOCTL
#   Win32_System_Performance            PDH, the only unelevated route to GPU
#                                       and ACPI thermal readings
#   Win32_Graphics_Dxgi                 EnumAdapters1, for adapter identity
#   Win32_Storage_Packaging_Appx        GetCurrentPackageFullName, which is how
#                                       the app knows it is running from an
#                                       MSIX and must leave updates to the Store
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Wdk_System_SystemInformation",
  "Wdk_System_Threading",
  "Win32_Foundation",
  "Win32_Graphics_Dxgi",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_Performance",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# ---------------------------------------------------------------------------
# Release profile
#
# `strip` removes the symbol table from the shipped binary.
#
# What it does NOT remove, and what caught us out: the source path of every
# `panic!` site and every `#[track_caller]` call is embedded as an ordinary
# static string, not as debug information. Unaddressed, LocalDocks.exe carried
# 898 copies of
#
#   C:\Users\<developer>\.cargo\registry\src\index.crates.io-.../<crate>/...
#
# and shipped the build machine's user name to everyone who installed it.
#
# The fix is `--remap-path-prefix`, set in scripts/build-release.ps1 from the
# building machine's own environment. It cannot live here: the flag needs
# absolute paths, and writing an absolute path into a committed file would put
# a developer's home directory in the repository to keep it out of the binary.
#
# (Cargo's `trim-paths` profile key does exactly this and needs no absolute
# paths, but it is still unstable as of Cargo 1.95 and hard-errors the build.
# Move to it when it lands.)
# ---------------------------------------------------------------------------
[profile.release]
strip = true
